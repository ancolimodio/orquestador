name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tipos
        run: mypy
      - name: Tests
        run: pytest --cov=prompt_maestro --cov-fail-under=80
      - name: Seguridad
        run: bandit -q -r src
      - name: Demo end-to-end
        run: python examples/demo.py

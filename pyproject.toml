[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "prompt-maestro"
version = "0.1.0"
description = "Harness multiagente para desarrollo de software asistido por IA."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Alan Colimodio" }]
keywords = ["ai-agents", "multi-agent", "harness-engineering", "llm", "asyncio"]
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "bandit>=1.7",
]

[project.scripts]
prompt-maestro = "prompt_maestro.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_maestro"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF", "N"]
ignore = ["E501"]  # el largo de línea lo aplica `ruff format`

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"examples/*" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["prompt_maestro"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
